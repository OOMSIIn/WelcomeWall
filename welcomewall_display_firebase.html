<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FAFAF9;
    --ink:#2E2E2E;
    --grey:#7A7A7A;
    --grey-soft:#A8A8A8;
    --line:#E7E5E2;
    --orange:#E8601C;
    --orange-deep:#C24E14;
    --good:#3F8A5C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background:#000;
    font-family:'Segoe UI', 'Noto Sans Thai', sans-serif;
    overflow:hidden;
  }
  /* ---- responsive scale: ปรับตามขนาดจอจริงโดยอัตโนมัติ ไม่ผูกกับจอใดจอหนึ่ง ---- */
  :root{
    --topbar-h: clamp(64px, 9vh, 200px);
    --pad-x: clamp(20px, 5vw, 80px);
    --pad-top: clamp(28px, 7vh, 100px);
    --pad-bottom: clamp(28px, 6vh, 90px);
  }
  #stage{
    width:100%; height:100%;
    position:relative;
    background:var(--bg);
    overflow:hidden;
  }
  .topbar{
    position:absolute; top:0; left:0; width:100%;
    height:var(--topbar-h);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 var(--pad-x);
    border-bottom:1px solid var(--line);
    background:#fff;
    z-index:10;
  }
  .brand{ display:flex; align-items:center; gap:clamp(10px,2vw,26px); min-width:0; }
  .brand img.logo{ height:clamp(28px,4.5vh,72px); width:auto; display:block; flex-shrink:0; }
  .brand .name{
    color:var(--ink); font-size:clamp(14px,2.2vh,32px); font-weight:700; letter-spacing:0.3px;
    border-left:1px solid var(--line); padding-left:clamp(10px,1.5vw,26px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .brand .name small{
    display:block; color:var(--grey); font-size:clamp(9px,1.1vh,16px); font-weight:400; letter-spacing:1.5px; text-transform:uppercase; margin-top:2px;
  }
  .clock{ text-align:right; color:var(--ink); flex-shrink:0; }
  .clock .time{ font-size:clamp(20px,3.6vh,56px); font-weight:700; letter-spacing:1px; font-variant-numeric: tabular-nums; color:var(--ink);}
  .clock .date{ font-size:clamp(10px,1.3vh,20px); color:var(--grey); margin-top:2px; white-space:nowrap; }

  .view{
    position:absolute; top:var(--topbar-h); left:0; width:100%; height:calc(100% - var(--topbar-h));
    padding:var(--pad-top) var(--pad-x) var(--pad-bottom);
    opacity:0; transition:opacity 0.9s ease;
    pointer-events:none;
    background:var(--bg);
    overflow:hidden;
  }
  .view.active{ opacity:1; pointer-events:auto; }

  .eyebrow{
    color:var(--orange); font-size:clamp(12px,1.6vh,24px); letter-spacing:4px; text-transform:uppercase; font-weight:700;
  }
  .welcome-headline{
    color:var(--ink); font-size:clamp(24px,5.5vh,84px); font-weight:300; margin-top:clamp(10px,2vh,26px); line-height:1.25;
  }
  .welcome-headline b{ font-weight:700; color:var(--ink); }

  .guest-list{ margin-top:clamp(24px,6vh,90px); display:flex; flex-direction:column; gap:0; overflow-y:auto; max-height:calc(100% - 220px); }
  .guest-row{
    display:flex; align-items:center; gap:clamp(12px,2.2vw,32px);
    padding:clamp(14px,3vh,44px) 0;
    border-bottom:1px solid var(--line);
  }
  .guest-time{
    width:clamp(56px,7vw,110px); flex-shrink:0;
    color:var(--orange); font-size:clamp(16px,2.4vh,36px); font-weight:700; font-variant-numeric: tabular-nums;
  }
  .guest-avatar{
    width:clamp(64px,8.5vh,132px); height:clamp(64px,8.5vh,132px); border-radius:clamp(10px,1.6vh,22px); flex-shrink:0;
    object-fit:cover; border:2px solid var(--line); background:var(--panel);
  }
  .guest-info{ flex:1; min-width:0; }
  .guest-name{ color:var(--ink); font-size:clamp(18px,2.8vh,42px); font-weight:600; }
  .guest-meta{ color:var(--grey); font-size:clamp(11px,1.5vh,22px); margin-top:clamp(2px,0.5vh,8px); }
  .guest-status{
    flex-shrink:0; font-size:clamp(9px,1vh,16px); font-weight:700; letter-spacing:0.5px; text-transform:uppercase;
    padding:clamp(5px,0.8vh,10px) clamp(10px,1.5vw,22px); border-radius:30px; border:1.5px solid;
  }
  .status-arrived{ color:var(--good); border-color:var(--good); background:rgba(63,138,92,0.07); }
  .status-waiting{ color:var(--orange); border-color:var(--orange); background:rgba(232,96,28,0.06); }

  .footnote{
    position:absolute; bottom:var(--pad-bottom); left:var(--pad-x); right:var(--pad-x);
    color:var(--grey); font-size:clamp(10px,1.3vh,20px); border-top:1px solid var(--line); padding-top:clamp(10px,2vh,30px);
    display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }

  .ann-grid{ display:flex; flex-direction:column; gap:clamp(16px,4vh,48px); margin-top:clamp(16px,3.5vh,44px); overflow-y:auto; max-height:calc(100% - 160px); }

  /* ---- หน้าแกลเลอรี: แสดงทีละรูป ขยายให้พอดี ตามขนาดภาพ กลางหน้าจอ ---- */
  #view-photos{ display:flex; flex-direction:column; }
  .photo-stage-wrap{
    flex:1; min-height:0;
    margin-top:clamp(10px,2vh,26px);
    width:100%;
    display:flex; align-items:center; justify-content:center;
  }
  .photo-stage-wrap img{
    width:100%; height:100%;
    object-fit:contain;
    border-radius:12px;
    box-shadow:0 20px 60px rgba(0,0,0,0.15);
    border:1px solid var(--line);
    background:var(--panel);
  }

  .ann-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:5px solid var(--orange);
    border-radius:4px;
    padding:clamp(18px,3.5vh,40px) clamp(20px,4vw,46px);
  }
  .ann-card.holiday{ border-left-color:var(--good); }
  .ann-tag{ font-size:clamp(10px,1.3vh,16px); letter-spacing:2px; text-transform:uppercase; font-weight:700; color:var(--orange); }
  .ann-card.holiday .ann-tag{ color:var(--good); }
  .ann-title{ color:var(--ink); font-size:clamp(18px,3.3vh,40px); font-weight:700; margin-top:clamp(6px,1.3vh,16px); }
  .ann-desc{ color:var(--grey); font-size:clamp(12px,1.8vh,22px); margin-top:clamp(4px,1vh,12px); line-height:1.5; }
  .ann-date{ color:var(--ink); font-size:clamp(10px,1.4vh,17px); margin-top:clamp(8px,1.8vh,22px); opacity:0.55; }

  .progress{
    position:absolute; top:var(--topbar-h); left:0; height:3px; background:var(--orange);
    width:0%; transition:width linear; z-index:20;
  }
</style>
</head>

    <div class="welcome-headline">เรื่องที่ทุกคน<br><b>ควรรู้สัปดาห์นี้</b></div>

    <div class="ann-grid" id="ann-list-display">
</div>
  </div>

  <div class="view" id="view-photos">
    <div class="eyebrow">แกลเลอรีภาพ · Gallery</div>
    <div class="photo-stage-wrap">
      <img id="photo-stage-img" src="" alt="">
    </div>
  </div>
</div>

<script type="module">
  import PocketBase from "https://cdn.jsdelivr.net/npm/pocketbase@0.21.5/dist/pocketbase.es.mjs";

  // TODO: เปลี่ยนเป็น URL ของ PocketBase server จริงของคุณ เช่น "https://your-app.pockethost.io"
  const POCKETBASE_URL = "http://127.0.0.1:8090";

  const pb = new PocketBase(POCKETBASE_URL);
  pb.autoCancellation(false); // กันไม่ให้ request ยกเลิกกันเองตอน realtime ยิงถี่ๆ

  const today = new Date().toISOString().slice(0,10);

  // ---- จอนี้คือจอไหน อ่านจาก URL เช่น display.html?screen=screen2 ----
  // ถ้าเปิดแบบไม่มี ?screen= เลย (จอหลัก) จะแสดงข้อมูลทุกอย่างเสมอ ไม่กรองอะไรเลย
  const urlParams = new URLSearchParams(location.search);
  const currentScreen = urlParams.get('screen');

  // เงื่อนไข filter สำหรับกรองข้อมูลตามจอ (คืนค่าว่างถ้าเป็นจอหลัก = แสดงทุกอย่าง)
  // ข้อมูลที่ไม่ได้ระบุจอไว้เลยตอนเพิ่ม (screens ว่าง) จะแสดงบนทุกจอเสมอไม่ว่าจอไหน
  function screenFilterClause(){
    if(!currentScreen) return '';
    return pb.filter('(screens = "" || screens ~ {:tag})', { tag: ','+currentScreen+',' });
  }

  // หมายเหตุ: ตอนนี้ #stage ใช้ CSS responsive (คลิก/vh/vw) เต็มพื้นที่หน้าจอโดยอัตโนมัติ
  // ไม่ต้องกำหนดขนาดจอตายตัวอีกต่อไป รองรับได้ทั้งจอมือถือ แท็บเล็ต ทีวี หรือจอสาธารณะทุกขนาด/สัดส่วน

  // ---- clock ----
  function tick(){
    const now = new Date();
    const days=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
    const months=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
    document.getElementById('clockTime').textContent =
      now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
    document.getElementById('clockDate').textContent =
      'วัน'+days[now.getDay()]+'ที่ '+now.getDate()+' '+months[now.getMonth()]+' '+(now.getFullYear()+543);
  }
  tick(); setInterval(tick, 1000*30);

  // ---- render guests on display ----
  function renderGuestDisplay(guests){
    const container = document.getElementById('guest-list-display');
    if(!container) return;
    container.innerHTML = '';

    // update headline count
    const countEl = document.getElementById('guest-count-display');
    if(countEl) countEl.textContent = guests.length;

    const headEl = document.getElementById('welcome-head');
    if(headEl) headEl.innerHTML = 'ยินดีต้อนรับแขกที่มาเยือน<br><b>วันนี้ทั้งหมด '+guests.length+' ราย</b>';

    guests.forEach(g=>{
      const row = document.createElement('div');
      row.className = 'guest-row';
      row.innerHTML = `
        <div class="guest-time">${g.time}</div>
        <img class="guest-avatar" src="${g.photo || 'https://placehold.co/128x128/E4E0D6/7A7A7A?text='+encodeURIComponent(g.name[0]||'?')}" alt="">
        <div class="guest-info">
          <div class="guest-name">${g.name}</div>
          <div class="guest-meta">${g.company||''} ${g.meta ? '· '+g.meta : ''}</div>
        </div>
        <div class="guest-status ${g.status==='arrived'?'status-arrived':'status-waiting'}">${g.status==='arrived'?'ถึงแล้ว':'กำลังมา'}</div>
      `;
      container.appendChild(row);
    });
  }

  // ---- render news on display ----
  function renderNewsDisplay(newsList){
    const container = document.getElementById('ann-list-display');
    if(!container) return;
    container.innerHTML = '';
    const labels = {event:'กิจกรรม', holiday:'วันหยุด', notice:'ประกาศ'};
    newsList.forEach(n=>{
      const card = document.createElement('div');
      card.className = 'ann-card' + (n.type==='holiday' ? ' holiday' : '');
      card.innerHTML = `
        <div class="ann-tag">${labels[n.type]||'ประกาศ'}</div>
        <div class="ann-title">${n.title}</div>
        <div class="ann-desc">${n.desc||''}</div>
        <div class="ann-date">${n.date||''}</div>
      `;
      container.appendChild(card);
    });
  }

  // ---- PocketBase: โหลดข้อมูล + realtime ----
  let hasGuests = false;
  let hasNews = false;
  let currentPhotos = [];

  async function loadGuests(){
    try{
      const clauses = [pb.filter('date = {:d}', { d: today })];
      const sc = screenFilterClause();
      if(sc) clauses.push(sc);
      const guests = await pb.collection('guests').getFullList({
        filter: clauses.join(' && '),
        sort: 'time'
      });
      renderGuestDisplay(guests);
      hasGuests = guests.length > 0;
      buildSequence();
    }catch(e){ console.error('โหลดรายชื่อแขกไม่สำเร็จ', e); }
  }

  async function loadNews(){
    try{
      const newsList = await pb.collection('news').getFullList({
        filter: screenFilterClause(),
        sort: 'created'
      });
      renderNewsDisplay(newsList);
      hasNews = newsList.length > 0;
      buildSequence();
    }catch(e){ console.error('โหลดข่าวไม่สำเร็จ', e); }
  }

  async function loadPhotos(){
    try{
      currentPhotos = await pb.collection('photos').getFullList({
        filter: screenFilterClause(),
        sort: '-created'
      });
      buildSequence();
    }catch(e){ console.error('โหลดรูปภาพไม่สำเร็จ', e); }
  }

  // ---- เคลียร์ข้อมูลแขกที่เก่าเกิน 7 วัน ออกจาก PocketBase อัตโนมัติ ----
  // เก็บประวัติแขกไว้ดูย้อนหลังได้ 7 วัน แทนที่จะลบทันทีที่ข้ามวัน
  function getCutoffDate(daysAgo){
    const d = new Date();
    d.setDate(d.getDate() - daysAgo);
    return d.toISOString().slice(0,10);
  }
  async function cleanupOldGuests(){
    try{
      const cutoff = getCutoffDate(7); // ลบเฉพาะข้อมูลที่เก่ากว่า 7 วัน
      const oldGuests = await pb.collection('guests').getFullList({
        filter: pb.filter('date < {:d}', { d: cutoff })
      });
      for(const g of oldGuests){
        await pb.collection('guests').delete(g.id);
      }
      if(oldGuests.length > 0) console.log('เคลียร์ข้อมูลแขกเก่าแล้ว:', oldGuests.length, 'รายการ');
    }catch(e){ console.error('เคลียร์ข้อมูลแขกเก่าไม่สำเร็จ', e); }
  }
  cleanupOldGuests();

  loadGuests();
  loadNews();
  loadPhotos();

  // realtime: เมื่อมีการ เพิ่ม/แก้/ลบ ใน collection ให้โหลดใหม่ทั้งชุด
  pb.collection('guests').subscribe('*', ()=> loadGuests());
  pb.collection('news').subscribe('*', ()=> loadNews());
  pb.collection('photos').subscribe('*', ()=> loadPhotos());

  // ---- view rotation (สร้างลำดับหน้าแบบไดนามิก: หน้าไหนไม่มีข้อมูลจะไม่ถูกแสดง) ----
  // - หน้าต้อนรับ: แสดงก็ต่อเมื่อมีแขกนัดไว้วันนี้
  // - หน้าข่าวสาร: แสดงก็ต่อเมื่อมีประกาศ
  // - หน้ารูปภาพ: แสดงทีละรูป วนตามจำนวนรูปที่มี (รูปละ 1 หน้าในรอบหมุน)
  // - ถ้าไม่มีข้อมูลอะไรเลยสักอย่าง จะ fallback ไปหน้าต้อนรับเสมอ กันจอว่างเปล่า
  let sequence = [];
  let idx = 0;
  let DURATION = 8000; // ค่าเริ่มต้น จะถูกแทนที่ด้วยค่าจาก settings ถ้ามี
  let rotateTimer = null;

  function buildSequence(){
    const prevStep = sequence[idx] || null;

    const seq = [];
    if(hasGuests) seq.push({ kind:'welcome' });
    if(hasNews) seq.push({ kind:'news' });
    currentPhotos.forEach((p,i)=> seq.push({ kind:'photo', index:i }));
    if(seq.length === 0) seq.push({ kind:'welcome' }); // fallback กันจอว่าง
    sequence = seq;

    // พยายามคงตำแหน่งเดิมไว้ถ้ายังมีอยู่ ไม่งั้นเริ่มใหม่ที่หน้าแรก
    let keepIdx = -1;
    if(prevStep){
      keepIdx = sequence.findIndex(s => s.kind===prevStep.kind && s.index===prevStep.index);
    }
    idx = keepIdx !== -1 ? keepIdx : 0;
    showStep(sequence[idx]);
  }

  function showStep(step){
    if(!step) return;
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    if(step.kind === 'welcome'){
      document.getElementById('view-welcome').classList.add('active');
    } else if(step.kind === 'news'){
      document.getElementById('view-news').classList.add('active');
    } else if(step.kind === 'photo'){
      const img = document.getElementById('photo-stage-img');
      const p = currentPhotos[step.index];
      img.src = p ? p.image : '';
      document.getElementById('view-photos').classList.add('active');
    }
  }

  function runProgress(){
    const bar = document.getElementById('progress');
    bar.style.transition = 'none';
    bar.style.width = '0%';
    requestAnimationFrame(()=>{
      bar.style.transition = 'width '+DURATION+'ms linear';
      bar.style.width = '100%';
    });
  }
  function rotate(){
    if(sequence.length < 2){ runProgress(); return; }
    idx = (idx+1) % sequence.length;
    showStep(sequence[idx]);
    runProgress();
  }
  function startRotation(){
    if(rotateTimer) clearInterval(rotateTimer);
    runProgress();
    rotateTimer = setInterval(rotate, DURATION);
  }
  startRotation();

  // ---- settings: โหลดเวลาแสดงผลแต่ละหน้าจาก PocketBase (แยกตามจอ ถ้าจอนี้ไม่มีตั้งเฉพาะ ใช้ค่าจอหลักแทน) ----
  async function loadSettings(){
    try{
      const records = await pb.collection('settings').getFullList({ sort: 'created' });
      const targetScreen = currentScreen || '';
      const rec = records.find(r => (r.screen || '') === targetScreen) || records.find(r => (r.screen || '') === '');
      if(rec){
        const sec = Number(rec.view_duration_sec) || 8;
        DURATION = sec * 1000;
        startRotation(); // เริ่มนับใหม่ด้วยเวลาที่อัปเดต
      }
    }catch(e){
      // ยังไม่มีการตั้งค่า ใช้ค่าเริ่มต้น 8 วินาทีต่อไป
    }
  }
  loadSettings();
  pb.collection('settings').subscribe('*', ()=> loadSettings());

  // ---- รีเฟรชหน้าเว็บอัตโนมัติทุก 10 นาที ----
  // ป้องกันเว็บค้าง/หน่วง/หลุดการเชื่อมต่อเรียลไทม์จากการเปิดทิ้งไว้นานๆ (จอ Display เปิด 24 ชม.)
  // เมื่อรีเฟรช โค้ดด้านบนทั้งหมด (รวมถึง cleanupOldGuests) จะรันซ้ำใหม่ตั้งแต่ต้นโดยอัตโนมัติ
  setInterval(() => { location.reload(); }, 10 * 60 * 1000);
</script>
</body>
</html>
